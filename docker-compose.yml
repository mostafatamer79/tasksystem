services:
  postgres:
    image: postgres:16
    container_name: tasksystem-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tasksystem
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    volumes:
      - tasksystem-pgdata:/var/lib/postgresql/data

volumes:
  tasksystem-pgdata:
